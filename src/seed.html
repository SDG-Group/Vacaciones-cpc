<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carga inicial</title></head>
<body style="font-family:system-ui,sans-serif;max-width:560px;margin:24px auto;padding:0 16px">
<h2>Carga inicial de datos</h2>
<p>Sube las personas, equipos, pendientes y días marcados de tu Excel. Elige el fichero <b>seed.json</b> (el que te di aparte, desde tu ordenador). Solo funciona si la base de datos está vacía.</p>
<p><input type="file" id="f" accept=".json"></p>
<button id="go" style="padding:10px 16px;font-size:1rem;cursor:pointer">Cargar datos iniciales</button>
<pre id="log"></pre>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="shim.js"></script>
<script>
var log = function(t){ document.getElementById("log").textContent += t + "\n"; };
document.getElementById("go").onclick = async function(){
  try {
    var db = await claude.use("db");
    if ((await db.doc("config/equipo").get()).exists){ log("Ya hay datos cargados. No toco nada."); return; }
    var f = document.getElementById("f").files[0]; if (!f){ log("Elige primero el fichero seed.json."); return; }
    var s = JSON.parse(await f.text());
    await db.doc("config/equipo").set(s.config);
    var ids = Object.keys(s.vacaciones);
    for (var i = 0; i < ids.length; i++){ await db.collection("vacaciones").doc(ids[i]).set(s.vacaciones[ids[i]]); log("✓ " + ids[i]); }
    log("Listo: " + ids.length + " personas. Ahora borra src/seed.html del repositorio.");
  } catch (e) { log("Error: " + e.message); }
};
</script></body></html>
